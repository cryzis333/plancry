<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="menu">
            <div class="logo">Plancry</div>
            <div id="re-switch">
                <div class="mode">mode</div>
                <div id="box"></div>
            </div>
            <div class="profile">profile</div>
        </div>
    </header>
    <main>
        <div class="timer" id="timer">00 : 00 : 00 : 00</div>
        <button id="start">Go</button>
        <button id="pause" class="hidden">Stop</button>
        <button id ="resume" class="hidden">Resume</button>
        <button id="reset" class="hidden">Reset</button>
    </main>
    <script src="script.js"></script>
</body>

</html>
