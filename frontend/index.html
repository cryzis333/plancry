<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>plancry</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="all-logo">
            <div class="logo">Cry Plan</div>
            <div class="logo-text">future is in your hands.</div>
        </div>
        <div class="date-and-clock">
            <div class="date" id="date"></div>
            <div class="clock" id="clock"></div>
        </div>
        <div class="profile">
            <span class="username">cryzis</span>
            <div class="avatar"></div>
        </div>
    </header>
<main>
    <nav class="sidebar">
        <button id="btn-H" class="btn-sidebar">H</button>
        <button id="btn-D" class="btn-sidebar">D</button>
        <button id="btn-P" class="btn-sidebar">P</button>
        <button id="btn-A" class="btn-sidebar">A</button>
        <button id="btn-T" class="btn-sidebar">T</button>
    </nav>

    <div id="H" class="H">
        <div class="section-title">Home</div>
        <div class="H-main">блок с тестом текста</div>
    </div>

    <div id="D" class="D hidden">
        <div class="section-title">Dashboard</div>
        <div class="D-main">нету нихуа</div>
    </div>

    <div id="P" class="P hidden">
        <div class="section-title">Project</div>
        <div class="P-funct">
            <button id="P-create" class="pill create-project">+ create new project</button>
            <button id="P-search" class="pill search-project">search</button>
        </div>
        <div class="P-main">
            <div class="pill now-project" id="P-now">тут юудет название выбраного проекта или типа того а так же информация которая должна быть тут</div>
            <div class="pill P-info-for-you" id="P-info-for-you">тут хз что будет</div>
        </div>
    </div>

    <div id="A" class="A hidden">
        <div class="section-title">Archive</div>
        <div class="A-main">здесь пока что ничего нет но скоро будет</div>
    </div>
</main>


    <script src="script.js"></script>
</body>

</html>
